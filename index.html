<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Life Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: ltr;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
              h1 {
            text-align: center;
            color: #2c3e50;
        }
        .tracker-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #eef2f3;
            border-radius: 8px;
        }
        .tracker-section h3 {
            margin-top: 0;
            color: #34495e;
        }
        label {
            display: block;
            margin: 8px 0;
            font-size: 16px;
            color: #333;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Islamic Life Tracker</h1>
        
        <div class="tracker-section">
            <h3>দৈনিক সালাত (Daily Prayers)</h3>
            <label><input type="checkbox"> ফজর (Fajr)</label>
            <label><input type="checkbox"> যোহর (Dhuhr)</label>
            <label><input type="checkbox"> আসর (Asr)</label>
            <label><input type="checkbox"> মাগরিব (Maghrib)</label>
            <label><input type="checkbox"> এশা (Isha)</label>
        </div>

        <div class="tracker-section">
            <h3>কুরআন তেলাওয়াত (Quran Recitation)</h3>
            <label><input type="checkbox"> আজকের তিলাওয়াত সম্পন্ন হয়েছে</label>
        </div>

        <div class="tracker-section">
            <h3>যিকির ও তাসবিহ (Zikr & Tasbih)</h3>
            <label><input type="checkbox"> সুবহানাল্লাহ (১০০ বার)</label>
            <label><input type="checkbox"> আলহামদুলিল্লাহ (১০০ বার)</label>
            <label><input type="checkbox"> আল্লাহু আকবার (১০০ বার)</label>
        </div>
    </div>
</body>
              </html>
