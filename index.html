<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b16">
<meta name="description" content="Islamic Life Tracker - Daily Islamic Attendance">
<title>Islamic Life Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
  --bg:#071b16;
  --card:#102a22;
  --card2:#193a2e;
  --gold:#e8c875;
  --green:#20a477;
  --text:#f5f5ef;
  --muted:#a9bdb2;
  --border:rgba(232,200,117,.2);
}
body.light {
  --bg:#f2f5f0;
  --card:#ffffff;
  --card2:#e9f0e9;
  --text:#17352b;
  --muted:#63766d;
  --border:#d5e1d8;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind Siliguri',sans-serif;
  transition:.25s;
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.5;cursor:not-allowed}
#app {max-width:650px;margin:auto;min-height:100vh;padding-bottom:30px}
[hidden] {display:none!important}
    .topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
.brand {font-size:19px;color:var(--gold);font-weight:700}
.topbar small {color:var(--muted)}
.icon-button {
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}
main {padding:15px}
.navigation {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:17px 0;
  background:var(--card);
  padding:9px;
  border:1px solid var(--border);
  border-radius:17px;
}
.nav-item {
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 3px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.nav-item span {font-size:12px}
.nav-item.active {
  background:var(--card2);
  color:var(--gold);
      }
    .auth-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  text-align:center;
  margin-top:35px;
}
.logo-circle {
  width:75px;
  height:75px;
  display:grid;
  place-items:center;
  margin:auto;
  border-radius:50%;
  font-size:40px;
  color:var(--gold);
  background:var(--card2);
}
.auth-card input:not([type=checkbox]),
.field {
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
}
.auth-card input:focus,.field:focus {
  border-color:var(--gold);
}
.check-label {
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  color:var(--muted);
  margin:12px 0;
    }
    .primary-button {
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:linear-gradient(120deg,#caa74e,#f3dc96);
  color:#14251d;
  font-weight:700;
}
.text-button {
  background:transparent;
  border:0;
  color:var(--gold);
  padding:10px;
}
.welcome-card {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px;
  border-radius:20px;
  background:linear-gradient(130deg,#104d37,#09251d);
  border:1px solid var(--border);
}
.welcome-card h2 {color:white;margin:8px 0}
.welcome-card p {color:var(--gold);margin:0}
.welcome-icon {font-size:45px}
.card,.progress-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-top:14px;
    }
    .progress-track {
  height:12px;
  border-radius:20px;
  overflow:hidden;
  background:var(--card2);
}
.progress-fill {
  width:0;
  height:100%;
  background:linear-gradient(90deg,#20a477,#e8c875);
  transition:.3s;
}
.attendance-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:var(--card2);
  border-radius:13px;
  padding:12px;
  margin:9px 0;
}
.attendance-row small {color:var(--muted)}
.attendance-button {
  border:0;
  border-radius:10px;
  padding:9px 13px;
  color:white;
  background:var(--green);
}
.attendance-button.done {background:#466b57}
.stat-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat-box {
  background:var(--card2);
  padding:14px;
  border-radius:14px;
}
.stat-box strong {
  display:block;
  font-size:24px;
  color:var(--gold);
      }
    .dua-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  margin:12px 0;
}
.arabic {
  font-family:'Amiri',serif;
  font-size:27px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  color:var(--gold);
}
.search-input,.date-input {
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  margin:10px 0;
}
.muted {color:var(--muted)}
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:#14251d;
  padding:12px 20px;
  border-radius:30px;
  display:none;
  z-index:99;
  width:max-content;
  max-width:90%;
}
.message {margin-top:12px;color:var(--gold)}
footer {
  text-align:center;
  padding:20px;
  color:var(--muted);
}
@media(max-width:380px) {
  .welcome-icon {font-size:32px}
  main {padding:10px}
}
</style>
</head>
<body>
<div id="app">

<header class="topbar">
  <div>
    <div class="brand">☪ Islamic Life Tracker</div>
    <small id="todayDate"></small>
  </div>
  <button class="icon-button" id="themeButton">☀️</button>
</header>

<main>

<section id="authSection">
  <div class="auth-card">
    <div class="logo-circle">☪</div>
    <h1>Welcome</h1>

    <div id="loginForm">

    <button class="nav-item" data-page="attendance">📋<span>হাজিরা</span></button>

    <button class="nav-item" data-page="search">🔎<span>Search</span></button>
    <button class="nav-item" data-page="reports">📊<span>Report</span></button>

  </nav>

  <section id="dashboardPage" class="page">
    <div id="dashboardContent"></div>
  </section>

  <section id="attendancePage" class="page" hidden>

  </section>

  <section id="duasPage" class="page" hidden>
    <div id="duasContent"></div>
  </section>

  <section id="searchPage" class="page" hidden>
    <div id="searchContent"></div>
  </section>

  <section id="reportsPage" class="page" hidden>

  <section id="settingsPage" class="page" hidden>

  </section>

</section>
</main>

<footer>
  ☪ Islamic Life Tracker
  <br><small>Build a better daily routine</small>
</footer>

<div id="toast" class="toast"></div>
</div>
<script type="module">

import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = https://xcbezhomtqnwrbhonwgu.supabase.co;
const SUPABASE_KEY = 'sb_publishable_cla-OecF7u1pa30Rf5M9gg_LQQ_7ERR';

const configured =
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('YOUR_SUPABASE') &&
  SUPABASE_KEY.length > 20 &&
  !SUPABASE_KEY.includes('YOUR_SUPABASE');

const db = configured
  ? createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const $ = id => document.getElementById(id);

const PRAYERS = [
  'ফজর','যোহর','আসর','মাগরিব','এশা'
];

let profile = null;
let currentPage = 'dashboard';

const localKey = key =>
  'ilt_' + (profile?.id || 'guest') + '_' + key;

function getLocal(key, fallback = []) {
  try {
    return JSON.parse(
      localStorage.getItem(localKey(key))
    ) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveLocal(key, value) {
  localStorage.setItem(
    localKey(key),
    JSON.stringify(value)
  );
}

function today() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function clock() {
  return new Date().toLocaleTimeString('bn-BD',{
    hour:'2-digit',
    minute:'2-digit'
  });
}

function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(
    () => el.style.display = 'none', 2600
  );
}

function safe(value='') {
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

function events() {
  return getLocal('events',[]);
}

function todayEvents() {
  return events().filter(e=>e.date===today());
}
async function registerUser() {
  if(!db) {
    toast('প্রথমে Supabase Configuration করুন।');
    return;
  }

  const name=$('registerName').value.trim();
  const email=$('registerEmail').value.trim();
  const password=$('registerPassword').value;
  const share=$('shareProfile').checked;

  if(!name || !email || password.length<6) {
    toast('সঠিক তথ্য পূরণ করুন।');
    return;
  }

  $('registerButton').disabled=true;

  try {
    const {data,error}=await db.auth.signUp({
      email,password,
      options:{
        data:{
          display_name:name,
          share_attendance:share
        }
      }
    });

    if(error) throw error;

    if(!data.session) {
      $('authMessage').textContent=
        'Email Confirmation করুন, তারপর Login করুন।';
      return;
    }

    await loadProfile(data.user.id);

    toast('Registration সফল হয়েছে!');
    openApp();

  } catch(e) {
    toast(e.message);
  } finally {
    $('registerButton').disabled=false;
  }
}

async function loginUser() {
  if(!db) {
    toast('Supabase URL ও Key সেট করুন।');
    return;
  }

  const email=$('loginEmail').value.trim();
  const password=$('loginPassword').value;

  $('loginButton').disabled=true;

  try {
    const {data,error}=await db.auth.signInWithPassword({
      email,password
    });

    if(error) throw error;

    await loadProfile(data.user.id);
    openApp();
    toast('Login সফল হয়েছে!');

  } catch(e) {
    toast(e.message);
  } finally {
    $('loginButton').disabled=false;
  }
}

async function loadProfile(authId) {
  const {data,error}=await db
    .from('profiles')
    .select('*')
    .eq('auth_id',authId)
    .single();

  if(error) throw error;

  profile=data;

  localStorage.setItem(
    'ilt_profile',
    JSON.stringify(profile)
  );
}

async function restoreSession() {
  const cached=localStorage.getItem('ilt_profile');

  if(cached) {
    try { profile=JSON.parse(cached); }
    catch {}
  }

  if(db && navigator.onLine) {
    try {
      const {data}=await db.auth.getSession();

      if(data.session) {
        await loadProfile(data.session.user.id);
      } else {
        profile=null;
        localStorage.removeItem('ilt_profile');
      }
    } catch(e) {
      console.log('Offline session:',e.message);
    }
  }

  if(profile) openApp();
  else showAuth();
}

function showAuth() {
  $('authSection').hidden=false;
  $('mainSection').hidden=true;
}

function openApp() {
  $('authSection').hidden=true;
  $('mainSection').hidden=false;

  $('userName').textContent=profile.display_name;
  $('userId').textContent=profile.id;

  $('todayDate').textContent=
    new Date().toLocaleDateString('bn-BD',{
      dateStyle:'full'
    });

  renderAll();
    }
    function addAttendance(type,details={}) {
  const list=events();

  const item={
    localId:crypto.randomUUID(),
    type,
    date:today(),
    time:clock(),
    details,
    synced:false
  };

  list.push(item);
  saveLocal('events',list);

  toast('হাজিরা সংরক্ষিত হয়েছে ✓');
  renderAll();

  if(navigator.onLine) {
    syncData();
  }

  return item;
}

function hasPrayer(name) {
  return todayEvents().some(e=>
    e.type==='prayer' && e.details.prayer===name
  );
}

function markPrayer(name) {
  if(hasPrayer(name)) {
    toast('এই নামাজের হাজিরা ইতিমধ্যে দেওয়া হয়েছে।');
    return;
  }

  addAttendance('prayer',{prayer:name});
}

function markSleep() {
  addAttendance('sleep');
}

function markWake() {
  addAttendance('wake');
}

function markMeal(name) {
  addAttendance('meal',{name});
}

function markGoing() {
  const place=prompt('কোথায় যাচ্ছেন?');
  if(place===null || !place.trim()) return;

  const reason=prompt('কী কারণে যাচ্ছেন?') || '';

  addAttendance('going',{
    place:place.trim(),
    reason:reason.trim()
  });
}

function markReturning() {
  addAttendance('returning');
}

function getSummary(date=today()) {
  const list=events().filter(e=>e.date===date);

  return {
    prayers:list.filter(e=>e.type==='prayer').length,
    meals:list.filter(e=>e.type==='meal').length,
    sleep:list.filter(e=>e.type==='sleep').length,
    wake:list.filter(e=>e.type==='wake').length,
    going:list.filter(e=>e.type==='going').length,
    returning:list.filter(e=>e.type==='returning').length
  };
    }
    async function syncData() {
  if(!db || !navigator.onLine || !profile) return;

  const pending=events().filter(e=>!e.synced);

  if(!pending.length) return;

  const rows=pending.map(e=>({
    user_id:profile.id,
    type:e.type,
    event_date:e.date,
    details:{...e.details,time:e.time}
  }));

  try {
    const {error}=await db
      .from('attendance')
      .insert(rows);

    if(error) throw error;

    const all=events().map(e=>({
      ...e,
      synced:true
    }));

    saveLocal('events',all);
    toast('Online Sync সম্পন্ন হয়েছে ✓');

  } catch(e) {
    console.error('Sync error:',e.message);
  }
}

window.addEventListener('online',()=>{
  syncData();
  toast('ইন্টারনেট সংযুক্ত হয়েছে।');
});

window.addEventListener('offline',()=>{
  toast('আপনি এখন Offline আছেন।');
});
    function renderAttendance() {
  const box=$('attendanceContent');

  let html='<h2>📋 দৈনিক হাজিরা</h2>';
  html+='<div class="card"><h3>🕌 পাঁচ ওয়াক্ত নামাজ</h3>';

  PRAYERS.forEach(name=>{
    const done=hasPrayer(name);

    html+=`
      <div class="attendance-row">
        <div>
          <strong>${name}</strong>
          <small>${done?'হাজিরা সম্পন্ন':'এখনও হাজিরা দেওয়া হয়নি'}</small>
        </div>
        <button class="attendance-button ${done?'done':''}"
          ${done?'disabled':''}
          data-prayer="${name}">
          ${done?'✓ সম্পন্ন':'হাজিরা দিন'}
        </button>
      </div>`;
  });

  html+='</div>';

  html+=`
    <div class="card">
      <h3>🌙 ঘুম ও জাগরণ</h3>
      <div class="attendance-row">
        <span>ঘুমাতে যাচ্ছি</span>
        <button class="attendance-button" id="sleepBtn">হাজিরা</button>
      </div>
      <div class="attendance-row">
        <span>ঘুম থেকে উঠেছি</span>
        <button class="attendance-button" id="wakeBtn">হাজিরা</button>
      </div>
    </div>

    <div class="card">
      <h3>🍽️ খাবারের হাজিরা</h3>
      ${['সকালের নাশতা','দুপুরের খাবার','বিকেলের খাবার','রাতের খাবার','অন্যান্য খাবার'].map((n,i)=>`
        <button class="action-button meal-btn" data-meal="${n}">
          ➕ ${n}
        </button>`).join('')}
    </div>

    <div class="card">
      <h3>🚶 বাইরে যাওয়া ও ফিরে আসা</h3>
      <button class="action-button" id="goingBtn">🚶 বাইরে যাচ্ছি</button>
      <button class="action-button" id="returningBtn">🏠 বাড়িতে ফিরেছি</button>
    </div>`;

  box.innerHTML=html;

  box.querySelectorAll('[data-prayer]').forEach(btn=>{
    btn.onclick=()=>markPrayer(btn.dataset.prayer);
  });

  box.querySelectorAll('.meal-btn').forEach(btn=>{
    btn.onclick=()=>markMeal(btn.dataset.meal);
  });

  $('sleepBtn').onclick=()=>{
    showDuaForAction('sleep');
  };

  $('wakeBtn').onclick=()=>{
    showDuaForAction('wake');
  };

  $('goingBtn').onclick=markGoing;
  $('returningBtn').onclick=markReturning;
    }
    const DUAS=[
 {
  title:'ঘুমানোর দোয়া',
  arabic:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',
  pronunciation:'বিসমিকা আল্লাহুম্মা আমূতু ওয়া আহইয়া।',
  meaning:'হে আল্লাহ! আপনার নামেই আমি মৃত্যুবরণ করি এবং জীবিত হই।',
  reference:'সহিহ বুখারি ৬৩২৪'
 },

function showDuaForAction(type) {
  const d=DUAS.find(x=>
    type==='sleep'
      ? x.title==='ঘুমানোর দোয়া'
      : x.title==='ঘুম থেকে ওঠার দোয়া'
  );

  if(!d) return;

  const confirmed=confirm(
    `${d.title}\n\n${d.arabic}\n\n${d.pronunciation}\n\n${d.meaning}\n\nদোয়াটি পড়ে থাকলে OK চাপুন।`
  );

  if(confirmed) {
    addAttendance(type);
  }
    }

    async function searchUser() {
  const id=$('userSearchId').value.trim();
  const result=$('searchResult');

  result.innerHTML='';

  if(!/^\d+$/.test(id)) {
    toast('সঠিক User ID লিখুন।');
    return;
  }

  if(!db || !navigator.onLine) {
    toast('User ID Search করতে Internet প্রয়োজন।');
    return;
  }

  if(Number(id)===Number(profile.id)) {
    toast('নিজের রিপোর্ট দেখতে Report অপশন ব্যবহার করুন।');
    return;
  }

  result.innerHTML='<div class="card">Searching...</div>';

  try {
    const {data:user,error}=await db
      .from('profiles')
      .select('id,display_name,created_at')
      .eq('id',Number(id))
      .eq('share_attendance',true)
      .maybeSingle();

    if(error) throw error;

    if(!user) {
      result.innerHTML=
        '<div class="card">ব্যবহারকারী পাওয়া যায়নি অথবা তিনি তথ্য শেয়ার করেননি।</div>';
      return;
    }

    const {data:list,error:attendanceError}=await db
      .from('attendance')
      .select('type,event_date,details,created_at')
      .eq('user_id',user.id)
      .order('created_at',{ascending:false})
      .limit(500);

    if(attendanceError) throw attendanceError;

    const records=list||[];

    const count=(date)=>
      records.filter(x=>x.event_date===date);

    const yesterday=new Date();
    yesterday.setDate(yesterday.getDate()-1);
    const yd=[
      yesterday.getFullYear(),
      String(yesterday.getMonth()+1).padStart(2,'0'),
      String(yesterday.getDate()).padStart(2,'0')
    ].join('-');

    const todayList=count(today());
    const yesterdayList=count(yd);

    result.innerHTML=`
      <div class="card">
        <h3>👤 ${safe(user.display_name)}</h3>
        <p>User ID: <strong>${user.id}</strong></p>
        <small class="muted">
          Joined: ${new Date(user.created_at).toLocaleDateString('bn-BD')}
        </small>
      </div>

      <div class="card">
        <h3>📅 আজকের রিপোর্ট</h3>
        ${renderRemoteRecords(todayList)}
      </div>

      <div class="card">
        <h3>📅 গতকালের রিপোর্ট</h3>
        ${renderRemoteRecords(yesterdayList)}
      </div>

      <div class="card">
        <h3>📋 সব পাওয়া রেকর্ড</h3>
        ${renderRemoteRecords(records)}
      </div>
    `;

  } catch(e) {
    result.innerHTML=
      `<div class="card">সমস্যা হয়েছে: ${safe(e.message)}</div>`;
  }
}

function renderRemoteRecords(list) {
  if(!list.length) {
    return '<p class="muted">কোনো হাজিরা পাওয়া যায়নি।</p>';
  }

  return list.map(e=>`
    <div class="attendance-row">
      <div>
        <strong>${safe(typeName(e.type,e.details))}</strong>
        <small>${safe(e.event_date)} · ${safe(e.details?.time||'')}</small>
      </div>
      <span>✓</span>
    </div>
  `).join('');
}

function typeName(type,details={}) {
  const names={
    prayer:'নামাজ: '+(details.prayer||''),
    sleep:'ঘুমানোর হাজিরা',
    wake:'ঘুম থেকে ওঠার হাজিরা',
    meal:'খাবার: '+(details.name||''),
    going:'বাইরে যাওয়া: '+(details.place||''),
    returning:'বাড়িতে ফিরে আসা'
  };

  return names[type]||type;
}

function showDateReport(date) {
  if(!date) return;

  const list=events().filter(e=>e.date===date);

  $('reportResult').innerHTML=`
    <div class="card">
      <h3>📅 ${date}</h3>
      <p>মোট হাজিরা: ${list.length}</p>
      ${renderLocalRecords(list)}
    </div>
  `;
}

function renderLocalRecords(list) {
  if(!list.length) {
    return '<p class="muted">এই দিনে কোনো হাজিরা নেই।</p>';
  }

  return list.map(e=>`
    <div class="attendance-row">
      <div>
        <strong>${safe(typeName(e.type,e.details))}</strong>
        <small>${safe(e.time)}</small>
      </div>
      <span>${e.synced?'☁️':'📱'}</span>
    </div>
  `).join('');
}

function showMonthReport() {
  const prefix=today().slice(0,7);

  const list=events().filter(
    e=>e.date.startsWith(prefix)
  );

  const days=new Set(list.map(e=>e.date)).size;

  $('monthReport').innerHTML=`
    <div class="stat-grid">
      <div class="stat-box">
        <strong>${list.length}</strong>
        মোট হাজিরা
      </div>
      <div class="stat-box">
        <strong>${days}</strong>
        হাজিরা দেওয়া দিন
      </div>
      <div class="stat-box">
        <strong>${list.filter(e=>e.type==='prayer').length}</strong>
        নামাজ
      </div>
      <div class="stat-box">
        <strong>${list.filter(e=>e.type==='meal').length}</strong>
        খাবার
      </div>
    </div>
  `;
}

function exportBackup() {
  const backup={
    userId:profile.id,
    name:profile.display_name,
    exportedAt:new Date().toISOString(),
    attendance:events()
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.href=url;
  a.download='islamic-life-backup.json';
  a.click();

  URL.revokeObjectURL(url);
  toast('Backup তৈরি হয়েছে।');
    }
    function renderCalendar() {
  const box=$('reportsContent');

  const year=new Date().getFullYear();
  const month=new Date().getMonth();

  const first=new Date(year,month,1).getDay();
  const total=new Date(year,month+1,0).getDate();

  let html=`
    <div class="card">
      <h3>📅 মাসিক হাজিরা ক্যালেন্ডার</h3>
      <div class="stat-grid">
  `;

  for(let i=0;i<first;i++) {
    html+='<div></div>';
  }

  for(let day=1;day<=total;day++) {
    const date=[
      year,
      String(month+1).padStart(2,'0'),
      String(day).padStart(2,'0')
    ].join('-');

    const count=events().filter(
      e=>e.date===date
    ).length;

    html+=`
      <button class="action-button calendar-day"
        data-date="${date}">
        ${day}
        <small>${count?'✓':''}</small>
      </button>
    `;
  }

  html+='</div></div>';

  box.insertAdjacentHTML('afterbegin',html);

  box.querySelectorAll('.calendar-day').forEach(btn=>{
    btn.onclick=()=>{
      showDateReport(btn.dataset.date);
    };
  });
}

async function savePrivacy() {
  if(!db || !navigator.onLine) {
    toast('Privacy পরিবর্তন করতে Internet লাগবে।');
    return;
  }

  const value=$('shareToggle').checked;

  try {
    const {data,error}=await db
      .from('profiles')
      .update({share_attendance:value})
      .eq('auth_id',(await db.auth.getUser()).data.user.id)
      .select()
      .single();

    if(error) throw error;

    profile=data;
    localStorage.setItem(
      'ilt_profile',JSON.stringify(profile)
    );

    toast('Privacy Update হয়েছে।');

  } catch(e) {
    toast(e.message);
  }
    }
   function showPage(page) {
  currentPage=page;

  document.querySelectorAll('.page').forEach(el=>{
    el.hidden=true;
  });

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle(
      'active',
      el.dataset.page===page
    );
  });

  const target=$(page+'Page');
  if(target) target.hidden=false;

  if(page==='dashboard') renderDashboard();
  if(page==='attendance') renderAttendance();
  if(page==='duas') renderDuas();
  if(page==='search') renderSearch();

  if(page==='reports') {
    renderReports();
    renderCalendar();
  }

  if(page==='settings') renderSettings();
}

function renderAll() {
  renderDashboard();
  renderAttendance();
  renderDuas();
  renderReports();
  renderCalendar();
  renderSettings();

  showPage(currentPage);
}

async function logoutUser() {
  if(!confirm('আপনি কি Logout করতে চান?')) return;

  try {
    if(db && navigator.onLine) {
      const {error}=await db.auth.signOut();
      if(error) throw error;
    }

    profile=null;
    localStorage.removeItem('ilt_profile');

    $('mainSection').hidden=true;
    $('authSection').hidden=false;

    toast('Logout সম্পন্ন হয়েছে।');

  } catch(e) {
    toast(e.message);
  }
}
